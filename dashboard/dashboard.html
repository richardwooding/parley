<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{APP}} — admin</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#2a3038;
    --fg:#e6edf3; --muted:#9aa7b4; --accent:#a371f7; --accent2:#bd93ff;
    --ok:#3fb950; --warn:#d29922;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family:ui-sans-serif,system-ui,sans-serif; }
  .wrap { max-width:70rem; margin:0 auto; padding:1.5rem 1.1rem 4rem; }
  header { display:flex; align-items:center; justify-content:space-between; gap:1rem;
    flex-wrap:wrap; margin-bottom:1.4rem; }
  h1 { font-size:1.15rem; margin:0; font-weight:700; letter-spacing:-0.01em; }
  h1 .dot { color:var(--accent); }
  .sub { color:var(--muted); font-size:.82rem; }
  a { color:var(--accent2); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));
    gap:.7rem; margin-bottom:1.6rem; }
  .stat { background:var(--panel); border:1px solid var(--border); border-radius:.6rem;
    padding:.7rem .8rem; }
  .stat .k { color:var(--muted); font-size:.72rem; text-transform:uppercase;
    letter-spacing:.04em; }
  .stat .v { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:1.25rem;
    margin-top:.2rem; }
  h2 { font-size:.9rem; color:var(--muted); font-weight:600; margin:0 0 .6rem;
    text-transform:uppercase; letter-spacing:.04em; }
  table { width:100%; border-collapse:collapse; font-size:.85rem; }
  th,td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--border);
    vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:.72rem; text-transform:uppercase;
    letter-spacing:.04em; }
  td.mono, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .pill { display:inline-block; padding:.05rem .4rem; border-radius:.5rem; font-size:.72rem;
    border:1px solid var(--border); background:var(--panel2); margin:0 .15rem .15rem 0; }
  .pill.held { color:var(--warn); border-color:color-mix(in srgb,var(--warn) 45%,transparent); }
  .pill.live { color:var(--ok); border-color:color-mix(in srgb,var(--ok) 45%,transparent); }
  .empty { color:var(--muted); padding:1rem .2rem; }
  .foot { color:var(--muted); font-size:.75rem; margin-top:1.2rem; }
  #err { color:var(--warn); font-size:.8rem; min-height:1em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot">●</span> {{APP}} <span class="sub">— admin</span></h1>
      <div class="sub" id="tagline">blind forwarder · live metadata only</div>
    </div>
    <div class="sub">refreshes every 3s · <a href="/auth/logout">log out</a></div>
  </header>

  <div id="err"></div>
  <div class="grid" id="stats"></div>

  <h2>Live sessions (<span id="sesscount">0</span>)</h2>
  <div id="sessions"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);

  function fmtDur(ns) {
    let s = Math.floor(ns / 1e9);
    const d = Math.floor(s / 86400); s -= d * 86400;
    const h = Math.floor(s / 3600); s -= h * 3600;
    const m = Math.floor(s / 60); s -= m * 60;
    if (d) return `${d}d ${h}h ${m}m`;
    if (h) return `${h}h ${m}m`;
    if (m) return `${m}m ${s}s`;
    return `${s}s`;
  }
  function fmtBytes(n) {
    const u = ["B", "KB", "MB", "GB", "TB"];
    let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${i ? n.toFixed(1) : n}${u[i]}`;
  }
  function fmtNum(n) { return (n ?? 0).toLocaleString("en-US"); }

  function statCard(k, v) {
    return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  }

  function renderStats(d) {
    $("stats").innerHTML = [
      statCard("Uptime", fmtDur(d.Uptime)),
      statCard("Active sessions", `${fmtNum(d.ActiveSessions)} <span class="sub">/ ${fmtNum(d.MaxSessions)}</span>`),
      statCard("Sessions created", fmtNum(d.SessionsCreated)),
      statCard("Frames forwarded", fmtNum(d.FramesForwarded)),
      statCard("Bytes forwarded", fmtBytes(d.BytesForwarded)),
      statCard("Joins", fmtNum(d.Joins)),
      statCard("Resumes", fmtNum(d.Resumes)),
      statCard("Errors", fmtNum(d.Errors)),
      statCard("Tracked IPs", fmtNum(d.TrackedIPs)),
      statCard("Max participants", fmtNum(d.MaxParticipants)),
      statCard("Grace", fmtDur(d.Grace)),
      statCard("Idle timeout", fmtDur(d.IdleTimeout)),
    ].join("");
  }

  function clientPills(clients) {
    return (clients || []).map((c) => {
      const held = c.Held;
      return `<span class="pill ${held ? "held" : "live"}">#${c.ID}${held ? " · grace" : ""} · gen ${c.Gen}</span>`;
    }).join("") || '<span class="sub">—</span>';
  }

  function renderSessions(sessions) {
    $("sesscount").textContent = (sessions || []).length;
    if (!sessions || !sessions.length) {
      $("sessions").innerHTML = '<div class="empty">No live sessions right now.</div>';
      return;
    }
    const rows = sessions.map((s) => `
      <tr>
        <td class="mono" title="${s.ID}">${s.ID.slice(0, 12)}…</td>
        <td class="mono">${fmtDur(s.AgeSeconds * 1e9)}</td>
        <td class="mono">${s.Participants} / ${s.MaxParticipants}</td>
        <td class="mono">#${s.Host}</td>
        <td class="mono">${s.IDsIssued}</td>
        <td>${clientPills(s.Clients)}</td>
      </tr>`).join("");
    $("sessions").innerHTML = `<table>
      <thead><tr><th>Session (id-hash)</th><th>Age</th><th>Players</th><th>Host</th><th>Issued</th><th>Participants</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  async function tick() {
    try {
      const r = await fetch("/dashboard/data", { cache: "no-store" });
      if (r.status === 401) { location.href = "/auth/login"; return; }
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      renderStats(d);
      renderSessions(d.Sessions);
      $("err").textContent = "";
      $("foot").textContent = "Updated " + new Date().toLocaleTimeString();
    } catch (e) {
      $("err").textContent = "Could not refresh: " + e.message;
    }
  }
  tick();
  setInterval(tick, 3000);
})();
</script>
</body>
</html>
